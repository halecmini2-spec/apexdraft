# Render blueprint — https://render.com/docs/blueprint-spec
# Apex Draft is a single self-contained HTML file, so it deploys as a
# static site: no build step, no container, no server process.
services:
  - type: web
    name: apexdraft
    runtime: static
    staticPublishPath: .
    # Any path serves the game, so deep links and refreshes don't 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

  # The game itself stays static and free. Only the party relay needs a
  # process, and all it does is pass messages between players in a room —
  # it holds no state beyond who is currently connected.
  - type: web
    name: apexdraft-relay
    runtime: node
    rootDir: relay
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
