# Render blueprint — https://render.com/docs/blueprint-spec
# Apex Drawn is a single self-contained HTML file, so it deploys as a
# static site: no build step, no container, no server process.
# The site and the relay are named apexdrawn. They were apexdraft: a Render
# service keeps the .onrender.com address it was born with whatever it is
# later called, so the only way to the new address was new services under
# the new names. The database keeps its name, because that is where the
# accounts are.
services:
  - type: web
    name: apexdrawn
    runtime: static
    staticPublishPath: .
    # Any path serves the game, so deep links and refreshes don't 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # The whole game is one file, so there is nothing here worth holding on
      # to for long. max-age=0 makes the browser revalidate every load — it
      # still gets a 304 and no download when nothing has changed — and the
      # short s-maxage stops the CDN serving yesterday's build for minutes
      # after a deploy.
      - path: /*
        name: Cache-Control
        value: public, max-age=0, s-maxage=30, must-revalidate
      # The old address checks this file exists here before sending anyone
      # over, so the move cannot strand a visitor on a name that never came
      # up. A cross-origin fetch needs the header.
      - path: /manifest.json
        name: Access-Control-Allow-Origin
        value: "*"

  # The game itself stays static and free. The relay is the only process,
  # and it does two things: pass messages between players in a room, which
  # it keeps nothing of, and keep accounts, which is the one thing here that
  # has to outlive a connection.
  - type: web
    name: apexdrawn-relay
    runtime: node
    rootDir: relay
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      # Without this the server keeps accounts in a file, and a free instance
      # has no filesystem that survives a restart — so every account would go
      # with it. Pointing it at Postgres is what makes an account an account.
      - key: DATABASE_URL
        fromDatabase:
          name: apexdraft-db
          property: connectionString
      # Usernames that get the admin controls, comma-separated. Set by hand
      # in the dashboard — it must never live in the repository, and there is
      # deliberately no way to grant it from inside the game.
      - key: ADMIN_USERS
        sync: false

# Free Postgres on Render expires 30 days after it is created. To keep the
# accounts past that, make a database somewhere that doesn't expire (Neon's
# free tier is the usual one) and set DATABASE_URL on the relay by hand —
# the server creates its own tables wherever it is pointed.
databases:
  - name: apexdraft-db
    plan: free
    databaseName: apexdraft
    user: apexdraft
